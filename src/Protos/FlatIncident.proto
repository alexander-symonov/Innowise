syntax = "proto3";
package DTO.InsuranceIncidents;

message FlatIncident {
  FlatAddress Address = 1;
  string OwnerNumber = 3;
  repeated string Tags = 4;

  message FlatAddress{
    string PostalCode = 1;
    string Country = 2;
    string City = 3;
    string Street = 4;
    string Building = 5;
  }
}