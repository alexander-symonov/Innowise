services:
  kafka:
    image: bitnami/kafka:latest
    container_name: innowise_kafka
    environment:
      - KAFKA_ENABLE_KRAFT=yes
      - KAFKA_CFG_PROCESS_ROLES=broker,controller
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL_SAME_HOST://:9095
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL_SAME_HOST:PLAINTEXT
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092,EXTERNAL_SAME_HOST://localhost:9095
      - KAFKA_CFG_BROKER_ID=1
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE=true
      - ALLOW_PLAINTEXT_LISTENER=yes
      - KAFKA_KRAFT_CLUSTER_ID=L0ZEQh1yTbGhNNUE7-6wSQ
      - KAFKA_CFG_NODE_ID=1
    ports:
      - "9095:9095"
    volumes:
      - data-warehouse-kafka:/bitnami/kafka
    networks:
      - kafka-network

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    depends_on:
      - kafka
    ports:
      - "8082:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    networks:
      - kafka-network

  api:
    image: innowise.api
    container_name: innowise_api
    build: 
      context: .
      dockerfile: docker/Dockerfile_dataapi
    ports: 
      - 8085:8080
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Kafka__BootstrapServers: kafka:9092
    depends_on:
      - kafka
    networks: 
      - kafka-network

  data-generator:
    container_name: innowise-data-generator
    build:
      context: .
      dockerfile: /docker/Dockerfile_generator
    environment:
      KafkaBootstrapServers: kafka:9092,
      KafkaTopicNamePrefix: insurance-incidents-
      DelayMs: 10
      ApiUri: http://api:8080/api/insurance
      ByApi: true
      TelegramBotToken: ${TELEGRAM_BOT_TOKEN}
    stdin_open: true # docker attach innowise-data-generator
    tty: true
    depends_on:
      - kafka
    networks:
      - kafka-network

  data-processor-car-incident:
    build:
      context: .
      dockerfile: /docker/Dockerfile_processor
    environment:
      Kafka__BrokersList: kafka:9092
      INCIDENT_TYPE: CarIncident
      IncidentsMongoDb__ConnectionString: mongodb://${MONGODB_LOGIN}:${MONGODB_PASSWORD}@mongo:27017?authSource=insurance
    depends_on:
      - kafka
    networks:
      - kafka-network
      - mongo-network

  data-processor-flat-incident:
    build:
      context: .
      dockerfile: /docker/Dockerfile_processor
    environment:
      BROKERS_LIST: kafka:9092
      INCIDENT_TYPE: FlatIncident
    depends_on:
      - kafka
    networks:
      - kafka-network
      - mongo-network

  data-processor-health-incident:
    build:
      context: .
      dockerfile: /docker/Dockerfile_processor
    environment:
      BROKERS_LIST: kafka:9092
      INCIDENT_TYPE: HealthIncident
    depends_on:
      - kafka
    networks:
      - kafka-network
      - mongo-network

  mongo:
    image: mongo
    container_name: innowise_mongo
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGODB_ROOT_LOGIN}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGODB_ROOT_PASSWORD}
    ports:
      - 27017:27017
    volumes:
      - data-warehouse-mongo:/data/db
      - ./docker/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    networks:
      - mongo-network

  mongo-express:
    image: mongo-express
    container_name: innowise_mongo-express
    restart: always
    ports:
      - 8081:8081
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: ${MONGODB_ROOT_LOGIN}
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${MONGODB_ROOT_PASSWORD}
      ME_CONFIG_MONGODB_URL: mongodb://${MONGODB_ROOT_LOGIN}:${MONGODB_ROOT_PASSWORD}@mongo:27017/
      ME_CONFIG_BASICAUTH: false
    depends_on:
      - mongo
    networks:
      - mongo-network
networks:
  kafka-network:
    driver: bridge
  mongo-network:
    driver: bridge

volumes:
  data-warehouse-kafka:
  data-warehouse-mongo:
